<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Galaxia del Amor</title>
    <style>
        body,
        html {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        .player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 2px solid #f60;
            border-radius: 999px;
            background: transparent;
            box-shadow: 0 0 15px #f60, 0 0 30px #f30;
            z-index: 1000;
            font-family: Arial, sans-serif;
            color: #fff;
            font-size: 14px;
        }
        
        .player button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            filter: drop-shadow(0 0 6px #ff6600);
            transition: transform 0.2s;
        }
        
        .player button:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px #ff3300);
        }
        
        .progress {
            flex-grow: 1;
            height: 14px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(270deg, #f60, #f30, #f09, #f60);
            background-size: 400% 400%;
            border-radius: 999px;
            box-shadow: 0 0 10px #f60;
            animation: flowing 6s ease infinite;
        }
        
        @keyframes flowing {
            0% {
                background-position: 0 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0 50%;
            }
        }
        
        .time {
            min-width: 74px;
            text-align: right;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 0 5px #f60;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <div class="player">
        <button id="play">▶️</button>

        <div class="progress" id="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="time" id="time">0:00 / 0:00</div>
    </div>

    <audio id="audio" loop>
    <source src="https://raw.githubusercontent.com/baque2005/public-files/main/assets/audio/448_1774754529333_Soulmate_x_Ame__lie_x_Interstellar_x_Passacaglia_edit_dEo7QKKXmAg.mp3" type="audio/mpeg">
  </audio>

    <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>

    <script>
        const audio = document.getElementById("audio");
        const playBtn = document.getElementById("play");
        const progress = document.getElementById("progress");
        const progressBar = document.getElementById("progress-bar");
        const timeDisplay = document.getElementById("time");

        let isPlaying = false;

        function formatTime(seconds) {
            if (!isFinite(seconds)) {
                return "0:00";
            }

            return Math.floor(seconds / 60) + ":" + Math.floor(seconds % 60).toString().padStart(2, "0");
        }

        playBtn.addEventListener("click", async() => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = "▶️";
            } else {
                await audio.play();
                playBtn.textContent = "⏸️";
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener("timeupdate", () => {
            const progressPercent = audio.currentTime / audio.duration * 100;
            progressBar.style.width = (isFinite(progressPercent) ? progressPercent : 0) + "%";
            timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
        });

        progress.addEventListener("click", (event) => {
            const rect = progress.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;

            if (isFinite(audio.duration)) {
                audio.currentTime = percent * audio.duration;
            }
        });

        const canvas = document.getElementById("c");
        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true
        });

        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);

        let targetDist = 300;
        let currentDist = 300;
        let rotX = 0.2;
        let rotY = 0;

        const loader = new THREE.TextureLoader();
        const nebulaTex = loader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/cube/space/px.jpg");

        scene.background = nebulaTex;

        (function createStars(count = 2000, radius = 3000) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(3 * count);

            for (let i = 0; i < count; i += 1) {
                const distance = radius * (0.3 + 0.7 * Math.random());
                const azimuth = Math.random() * Math.PI * 2;
                const inclination = Math.acos(2 * Math.random() - 1);

                positions[3 * i + 0] = distance * Math.sin(inclination) * Math.cos(azimuth);
                positions[3 * i + 1] = distance * Math.cos(inclination);
                positions[3 * i + 2] = distance * Math.sin(inclination) * Math.sin(azimuth);
            }

            geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
            scene.add(new THREE.Points(
                geometry,
                new THREE.PointsMaterial({
                    size: 1.5,
                    color: 0xffffff,
                    depthWrite: false
                })
            ));
        })();

        const coreMat = new THREE.MeshPhongMaterial({
            color: 0x111111,
            transparent: true,
            opacity: 0.6,
            shininess: 200
        });

        const core = new THREE.Mesh(new THREE.SphereGeometry(40, 64, 64), coreMat);
        scene.add(core);

        function makeCenterTextTexture(text) {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 512;

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 80px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#ff0033";
            ctx.shadowColor = "#ff66aa";
            ctx.shadowBlur = 50;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        const centerTex = makeCenterTextTexture("MES #4 ❤️");
        const centerMat = new THREE.SpriteMaterial({
            map: centerTex,
            transparent: true
        });

        const centerSprite = new THREE.Sprite(centerMat);
        centerSprite.scale.set(60, 60, 1);
        centerSprite.position.set(0, 0, 0);
        centerSprite.renderOrder = 999;
        scene.add(centerSprite);

        function makeGlow(size = 768, color1 = "255,160,0", color2 = "255,60,0") {
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext("2d");
            const gradient = ctx.createRadialGradient(
                size / 2,
                size / 2,
                0.05 * size,
                size / 2,
                size / 2,
                0.5 * size
            );

            gradient.addColorStop(0, "rgba(" + color1 + ",0.9)");
            gradient.addColorStop(0.5, "rgba(" + color2 + ",0.5)");
            gradient.addColorStop(1, "rgba(0,0,0,0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            return new THREE.CanvasTexture(canvas);
        }

        const glow = new THREE.Sprite(new THREE.SpriteMaterial({
            map: makeGlow(),
            transparent: true,
            depthWrite: false
        }));

        glow.scale.set(500, 500, 1);
        scene.add(glow);

        function ringTexture(size = 768) {
            const canvas = document.createElement("canvas");
            canvas.width = canvas.height = size;

            const ctx = canvas.getContext("2d");
            ctx.translate(size / 2, size / 2);

            const innerRadius = 0.34 * size;
            const outerRadius = 0.49 * size;
            const gradient = ctx.createRadialGradient(0, 0, 0.3 * innerRadius, 0, 0, outerRadius);

            gradient.addColorStop(0, "rgba(255,255,200,1)");
            gradient.addColorStop(0.3, "rgba(255,160,60,0.9)");
            gradient.addColorStop(0.65, "rgba(255,80,0,0.6)");
            gradient.addColorStop(1, "rgba(0,0,0,0)");

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, outerRadius, 0, Math.PI * 2);
            ctx.arc(0, 0, innerRadius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const ring1 = new THREE.Mesh(
            new THREE.RingGeometry(60, 80, 128),
            new THREE.MeshBasicMaterial({
                map: ringTexture(),
                transparent: true,
                side: THREE.DoubleSide
            })
        );

        const ring2 = new THREE.Mesh(
            new THREE.RingGeometry(85, 100, 128),
            new THREE.MeshBasicMaterial({
                map: ringTexture(),
                transparent: true,
                side: THREE.DoubleSide,
                opacity: 0.6
            })
        );

        ring1.rotation.x = ring2.rotation.x = Math.PI / 2;
        scene.add(ring1, ring2);

        const WORDS = [];
        const baseWords = [
            "🖤 Mi amor",
            "🌞 Mi sol",
            "🌎 Mi mundo",
            "✨ Brillas como nadie",
            "❤️ TE AMO",
            "Mi Universo",
            "👑 Mi reina",
            "🌠 Mi Estrella",
            "💫 Mi cielo",
            "🔥 Siempre serás tú",
            "✨️ Tu risa",
            "Tus ojitos",
            "💎 Eres todo",
            "Gracias por estar",
            "🌹 Mi Amor eterno",
            "🤗 Mil Abrazos",
            "💛 Yuli",
            "🌈 Mi Alegría",
            "🌟 Siempre Contigo",
            "🧸 La niña",
            "🧸 de mi noviembre",
            "🎁 Mi razón de ser",
            "🌙 Mi destino",
            "💌 MIA",
            "🕊️ Mi paz",
            "🪐 Mi universo",
            "🌊 Mi calma",
            "💡 Mi luz",
            "🍒 TUYO",
            "🥰 Mi vida",
            "🎇 Mi Felicidad",
            "Yuli",
            "Mi Niña hermosa",
            " Mi Eternidad",
            "🌟 Mi Sueño",
            "✨ Mi Magia",
            " CORAZON",
            "⭐ Mi estrella",
            "💖 FELIZ de estar",
            "🌄 Mi Amanecer",
            "🌃 Mi infinito",
            "💛 TE AMO",
            "💫 Mi inspiración",
            "🌷 Siempre juntos",
            "🌙 Mi Mujer perfecta",
            " 💛MES 03,02",
            "🪞 Mi reflejo"
        ];

        for (let i = 0; i < 6; i += 1) {
            WORDS.push(...baseWords);
        }

        function makeTextTexture(text, shadowColor) {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 128;

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 60px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#fff";
            ctx.shadowColor = shadowColor;
            ctx.shadowBlur = 30;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        const COLORS = [
            "#ff66ff",
            "#66ccff",
            "#ffd36b",
            "#ff9966",
            "#8df59a",
            "#ffa0f8",
            "#c6a7ff",
            "#ff4444",
            "#44ff99",
            "#99ccff"
        ];

        const textGroup = new THREE.Group();
        scene.add(textGroup);

        for (let i = 0; i < WORDS.length; i += 1) {
            const texture = makeTextTexture(WORDS[i], COLORS[i % COLORS.length]);
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(50, 16, 1);

            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            const radius = 150 + 120 * Math.random();

            sprite.position.set(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );

            sprite.userData = {
                phi,
                theta,
                radius,
                speed: 0.001 + 0.001 * Math.random()
            };

            textGroup.add(sprite);
        }

        let dragging = false;
        let lastX = 0;
        let lastY = 0;
        let pinch = 0;

        function onDown(event) {
            dragging = true;
            const pointer = event.touches ? event.touches[0] : event;
            lastX = pointer.clientX;
            lastY = pointer.clientY;
        }

        function onMove(event) {
            if (!dragging) {
                return;
            }

            const pointer = event.touches ? event.touches[0] : event;
            const deltaX = (pointer.clientX - lastX) / window.innerWidth;
            const deltaY = (pointer.clientY - lastY) / window.innerHeight;

            rotY -= 3 * deltaX;
            rotX = Math.max(-1.2, Math.min(1.2, rotX - 2.2 * deltaY));

            lastX = pointer.clientX;
            lastY = pointer.clientY;
        }

        function onUp() {
            dragging = false;
        }

        window.addEventListener("mousedown", onDown);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        window.addEventListener("touchstart", onDown, {
            passive: true
        });
        window.addEventListener("touchmove", onMove, {
            passive: true
        });
        window.addEventListener("touchend", onUp, {
            passive: true
        });

        window.addEventListener("wheel", (event) => {
            targetDist += 0.25 * event.deltaY;
            targetDist = Math.max(160, Math.min(600, targetDist));
        }, {
            passive: true
        });

        window.addEventListener("touchmove", (event) => {
            if (event.touches && event.touches.length === 2) {
                event.preventDefault();

                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                const distance = Math.hypot(dx, dy);

                if (pinch) {
                    targetDist += 0.5 * (pinch - distance);
                    targetDist = Math.max(160, Math.min(600, targetDist));
                }

                pinch = distance;
            }
        }, {
            passive: false
        });

        window.addEventListener("touchend", () => {
            pinch = 0;
        }, {
            passive: true
        });

        let tickTime = 0;

        function tick() {
            requestAnimationFrame(tick);

            tickTime += 0.01;
            ring1.rotation.z += 0.002;
            ring2.rotation.z -= 0.0015;
            glow.scale.set(
                500 * (1 + 0.03 * Math.sin(0.4 * tickTime)),
                500 * (1 + 0.03 * Math.sin(0.4 * tickTime)),
                1
            );

            const scale = 1 + 0.05 * Math.sin(3 * tickTime);
            core.scale.set(scale, scale, scale);

            textGroup.children.forEach((child) => {
                child.material.opacity = 0.8 + 0.2 * Math.sin(2 * tickTime);
                child.userData.theta += child.userData.speed;
                child.position.x = child.userData.radius * Math.sin(child.userData.phi) * Math.cos(child.userData.theta);
                child.position.z = child.userData.radius * Math.sin(child.userData.phi) * Math.sin(child.userData.theta);
            });

            currentDist += 0.06 * (targetDist - currentDist);

            const cosX = Math.cos(rotX);
            const sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY);
            const sinY = Math.sin(rotY);

            camera.position.set(
                currentDist * sinY * cosX,
                currentDist * sinX,
                currentDist * cosY * cosX
            );

            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        tick();
    </script>

</body>
